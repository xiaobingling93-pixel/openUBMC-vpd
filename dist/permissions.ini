# syntax documentation
# format: name type mode uid gid
# name is the path to the file you want to create/modify
# type is the type of the file, being one of:
#   f: a regular file
#   d: a directory
#   r: a directory recursively
# mode are the usual permissions settings (only numerical values are allowed)
# name is the path to the file you want to create/modify
opt/bmc/apps/remote_console d 550 104 104
opt/bmc/apps/remote_console/dft_data r 440 104 104
opt/bmc/apps/remote_console/dft_data rd 550 104 104
opt/bmc/soc r 440 0 0
opt/bmc/soc rd 440 0 0

etc/logrotate.d d 750 0 0
etc/logrotate.d/nginx f 640 0 0
etc/logrotate.d/frame f 640 0 0